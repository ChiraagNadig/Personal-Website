<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191f36"/>
      <stop offset="100%" stop-color="#2a3155"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302a55"/>
      <stop offset="100%" stop-color="#241f42"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg2)"/>

  <!-- scattered binary / cipher texture -->
  <g fill="#bba3f4" fill-opacity="0.18" font-family="monospace" font-size="13">
    <text x="30" y="50">01 10 11</text>
    <text x="270" y="70">10 01</text>
    <text x="24" y="350">11 01 00</text>
    <text x="300" y="330">01 11</text>
    <text x="24" y="130">A9 F2</text>
    <text x="310" y="200">3C 7E</text>
  </g>

  <!-- book -->
  <g>
    <rect x="118" y="95" width="164" height="210" rx="10" fill="url(#cover)" stroke="#bba3f4" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="118" y="95" width="14" height="210" rx="6" fill="#191f36" fill-opacity="0.5"/>
    <line x1="150" y1="120" x2="255" y2="120" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <line x1="150" y1="140" x2="240" y2="140" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <line x1="150" y1="252" x2="255" y2="252" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <line x1="150" y1="272" x2="230" y2="272" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  </g>

  <!-- padlock -->
  <g transform="translate(200 195)">
    <circle r="58" fill="#191f36" fill-opacity="0.55"/>
    <path d="M-18 -8 v-14 a18 18 0 0 1 36 0 v14" fill="none" stroke="#bba3f4" stroke-width="8" stroke-linecap="round"/>
    <rect x="-26" y="-10" width="52" height="42" rx="8" fill="#bba3f4"/>
    <circle cx="0" cy="8" r="6" fill="#241f42"/>
    <rect x="-3" y="10" width="6" height="12" rx="2" fill="#241f42"/>
  </g>
</svg>
