<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191f36"/>
      <stop offset="100%" stop-color="#2a3155"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bba3f4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bba3f4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- globe -->
  <circle cx="200" cy="205" r="115" fill="none" stroke="#bba3f4" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="200" cy="205" rx="45" ry="115" fill="none" stroke="#bba3f4" stroke-opacity="0.3" stroke-width="1.6"/>
  <ellipse cx="200" cy="205" rx="90" ry="115" fill="none" stroke="#bba3f4" stroke-opacity="0.22" stroke-width="1.6"/>
  <ellipse cx="200" cy="140" rx="115" ry="28" fill="none" stroke="#bba3f4" stroke-opacity="0.25" stroke-width="1.6"/>
  <ellipse cx="200" cy="205" rx="115" ry="28" fill="none" stroke="#bba3f4" stroke-opacity="0.3" stroke-width="1.6"/>
  <ellipse cx="200" cy="270" rx="115" ry="28" fill="none" stroke="#bba3f4" stroke-opacity="0.25" stroke-width="1.6"/>

  <!-- radar pulse at crisis point -->
  <circle cx="245" cy="170" r="70" fill="url(#pulse)"/>
  <circle cx="245" cy="170" r="46" fill="none" stroke="#bba3f4" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="245" cy="170" r="26" fill="none" stroke="#bba3f4" stroke-opacity="0.6" stroke-width="1.4"/>

  <!-- pins -->
  <path d="M245 158 c-8 0 -14 6 -14 14 c0 10 14 24 14 24 s14 -14 14 -24 c0 -8 -6 -14 -14 -14z" fill="#bba3f4"/>
  <circle cx="245" cy="172" r="4.5" fill="#191f36"/>

  <path d="M150 235 c-5.5 0 -10 4.5 -10 10 c0 7 10 17 10 17 s10 -10 10 -17 c0 -5.5 -4.5 -10 -10 -10z" fill="#bba3f4" fill-opacity="0.7"/>
  <circle cx="150" cy="245" r="3.2" fill="#191f36"/>

  <path d="M270 250 c-5.5 0 -10 4.5 -10 10 c0 7 10 17 10 17 s10 -10 10 -17 c0 -5.5 -4.5 -10 -10 -10z" fill="#bba3f4" fill-opacity="0.55"/>
  <circle cx="270" cy="260" r="3.2" fill="#191f36"/>

  <!-- plane path -->
  <g transform="translate(90 110) rotate(-18)" fill="#ffffff" fill-opacity="0.85">
    <path d="M0 4 L26 4 L36 0 L40 2 L32 8 L26 8 L14 16 L20 16 L24 20 L14 20 L8 26 L4 26 L7 18 L0 18 L-4 22 L-8 22 L-4 15 L0 8 Z"/>
  </g>
  <path d="M60 128 q40 -22 75 -8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.4" stroke-dasharray="2 5"/>

  <!-- ship -->
  <g transform="translate(295 310)" fill="#ffffff" fill-opacity="0.8">
    <path d="M-22 0 L22 0 L15 14 L-15 14 Z"/>
    <rect x="-4" y="-16" width="8" height="16"/>
    <path d="M4 -16 L20 -8 L4 -4 Z"/>
  </g>
  <path d="M250 330 q45 6 75 -4" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.4"/>
</svg>
